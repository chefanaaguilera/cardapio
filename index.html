<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <script src="https://myhub.ia.br/canvas-vendor/tailwind.js"></script>
  <style>
    body {
      margin: 0;
      padding: 16px;
      box-sizing: border-box;
      font-family: system-ui, sans-serif;
    }
  </style>
</head>
<body>
  <div class="min-h-screen bg-pink-50 text-stone-800 pb-32 font-sans">
    <header class="bg-gradient-to-b from-pink-200 to-pink-300 text-white text-center pt-0 pb-10 px-4 shadow-lg">
      <img src="./imagens//boneca.png" alt="Ana Aguilera - Chef" class="relative z-10 block w-64 h-64 md:w-80 md:h-80 object-cover mx-auto mb-0 mt-8">
      <p class="text-sm tracking-[0.3em] uppercase text-pink-100">Chef</p>
      <h1 class="text-4xl md:text-5xl font-bold mt-1" style="font-family: Georgia, serif;">Ana Aguilera</h1>
      <p class="mt-3 text-lg text-pink-50">Cardápio Especial de Natal ✨</p>
    </header>

    <nav class="sticky top-0 z-20 bg-white/95 backdrop-blur border-b border-pink-200 shadow-sm">
      <div id="tabs" class="flex gap-2 overflow-x-auto px-4 py-3 max-w-6xl mx-auto"></div>
    </nav>

    <main id="menu" class="max-w-6xl mx-auto px-4 py-8 space-y-12"></main>

    <div class="fixed bottom-0 inset-x-0 z-30 bg-pink-400 text-white shadow-2xl">
      <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between gap-4">
        <div>
          <p class="text-sm text-pink-100"><span id="count">0</span> item(ns) no pedido</p>
          <p class="text-xl font-bold" id="total">R$ 0,00</p>
        </div>
        <button id="verPedido" class="bg-white hover:bg-pink-100 text-pink-700 font-semibold px-5 py-2 rounded-full disabled:opacity-50">Ver pedido</button>
      </div>
    </div>

    <div id="modal" class="hidden fixed inset-0 z-40 bg-black/50 flex items-end md:items-center justify-center p-4">
      <div class="bg-white rounded-2xl w-full max-w-lg max-h-[80vh] flex flex-col shadow-2xl">
        <div class="flex justify-between items-center px-5 py-4 border-b border-pink-100">
          <h2 class="text-xl font-bold text-pink-700">Seu pedido</h2>
          <button id="fechar" class="text-stone-500 hover:text-stone-800 text-2xl leading-none">&times;</button>
        </div>
        <div id="lista" class="px-5 py-4 overflow-y-auto space-y-3 flex-1"></div>
        <div class="px-5 py-4 border-t border-pink-100 flex justify-between items-center">
          <span class="font-semibold">Total</span>
          <span id="totalModal" class="text-xl font-bold text-pink-700">R$ 0,00</span>
        </div>
        <div class="px-5 py-4 border-t border-pink-100 space-y-3">
          <input id="cliNome" type="text" placeholder="Seu nome" class="w-full border border-pink-200 rounded-lg px-3 py-2 focus:outline-none focus:border-pink-400">
          <input id="cliTel" type="tel" placeholder="Telefone com DDD, ex: (11) 99999-9999" class="w-full border border-pink-200 rounded-lg px-3 py-2 focus:outline-none focus:border-pink-400">
          <p id="erroCli" class="hidden text-sm text-red-600"></p>
          <button id="enviarWhats" class="w-full bg-green-500 hover:bg-green-400 text-white font-semibold py-3 rounded-full">Enviar pedido pelo WhatsApp</button>
        </div>
      </div>
    </div>
  </div>

  <style>
    html { scroll-behavior: smooth; }
    .tab-active { background-color: #f472b6; color: #fff; }
  </style>

  <script>
    const categorias = [
      { id: 'salgados', label: 'Salgados' },
      { id: 'paes', label: 'Pães & Patês' },
      { id: 'rocamboles', label: 'Rocamboles' },
      { id: 'tortas', label: 'Tortas' },
      { id: 'bolos', label: 'Bolo & Panetones' },
      { id: 'biscoitos', label: 'Biscoitos' }
    ];

    // Adicione o caminho de cada foto no campo img, por exemplo: img: 'imagens/empadao-pera-gorgonzola.jpg'
    const itens = [
      { id: 'emp-pera', cat: 'salgados', nome: 'Empadão Pêra & Gorgonzola', desc: 'Pera delicadamente combinada com queijo gorgonzola, mel e nozes.', preco: 120, emoji: '🍐', img: './imagens//empadao.jpeg', pos: '50% 50%', bg: 'from-amber-100 to-orange-200' },
      { id: 'emp-camarao', cat: 'salgados', nome: 'Empadão de Camarão', desc: 'Recheio cremoso e generoso de camarões.', preco: 120, emoji: '🦐', img: './imagens//empadao.jpeg', pos: '50% 50%', bg: 'from-orange-100 to-red-200' },
      { id: 'emp-pernil', cat: 'salgados', nome: 'Empadão de Pernil', desc: 'Suculência do pernil com alho-poró levemente adocicado e o perfume especial do tomilho.', preco: 120, emoji: '🍖', img: './imagens//empadao.jpeg', pos: '50% 50%', bg: 'from-rose-100 to-amber-200' },

      { id: 'cesta-paes', cat: 'paes', nome: 'Cesta de Pães', desc: '2 baguetes, 2 pães francês e 1 pão italiano. Perfeitos para acompanhar os patês.', preco: 100, emoji: '🥖', img: './imagens//cesta_paes.jpeg', pos: '50% 50%', bg: 'from-yellow-100 to-amber-300' },
      { id: 'homus', cat: 'paes', nome: 'Patê de Homus', desc: '100g. Cremoso e suave, ideal para acompanhar a cesta de pães.', preco: 20, emoji: '🫘', img: './imagens//pate_homus.jpg', pos: '50% 50%', bg: 'from-lime-100 to-yellow-200' },
      { id: 'patê-azeitonas', cat: 'paes', nome: 'Patê de Azeitonas Pretas', desc: '100g. Sabor intenso e marcante, perfeito com os pães.', preco: 20, emoji: '🫒', img: './imagens//pate_azeitona.jpg', pos: '50% 50%', bg: 'from-stone-200 to-stone-400' },

      { id: 'roc-tropical', cat: 'rocamboles', nome: 'Rocambole Magia Tropical', desc: 'Cocada cremosa e abacaxi.', preco: 100, emoji: '🍍', img: './imagens//rocambole_cocada.jpeg', pos: '50% 70%', bg: 'from-yellow-100 to-lime-200' },
      { id: 'roc-natalina', cat: 'rocamboles', nome: 'Rocambole Delícia Natalina', desc: 'Maçã, canela e doce de leite.', preco: 100, emoji: '🍎', img: './imagens//rocambole_delicia.jpeg', pos: '50% 50%', zoom: 1.6, bg: 'from-red-100 to-amber-200' },
      { id: 'roc-red', cat: 'rocamboles', nome: 'Rocambole Red Velvet Natalino', desc: 'Brigadeiro cremoso de chocolate branco e morangos.', preco: 100, emoji: '🍓', img: './imagens//rocambole_red_velvet.jpeg', pos: '50% 60%', bg: 'from-pink-100 to-red-300' },

      { id: 'torta-limao', cat: 'tortas', nome: 'Torta de Limão', desc: 'Creme cítrico e refrescante com o frescor do limão.', preco: 120, emoji: '🍋', img: './imagens//torta_limao.jpeg', bg: 'from-yellow-100 to-lime-200' },
      { id: 'torta-morango', cat: 'tortas', nome: 'Torta de Morango', desc: 'Creme leve com morangos frescos e doces.', preco: 120, emoji: '🍓', img: './imagens//torta_morango.jpeg', bg: 'from-pink-100 to-red-200' },
      { id: 'torta-banoffe', cat: 'tortas', nome: 'Torta Banoffe', desc: 'Base crocante, banana e doce de leite, creme de leite fresco e toque de cacau.', preco: 140, emoji: '🍰', img: './imagens//torta_banoffe.jpeg', bg: 'from-amber-100 to-orange-300' },
      { id: 'torta-pessego', cat: 'tortas', nome: 'Torta de Pêssego', desc: 'Creme leve e delicado com pêssegos frescos.', preco: 140, emoji: '🍑', img: './imagens//pessego.jpeg', bg: 'from-orange-100 to-pink-200' },
      { id: 'torta-damasco', cat: 'tortas', nome: 'Torta de Damasco', desc: 'Creme leve com damascos selecionados e um toque cítrico.', preco: 140, emoji: '🟠', img: './imagens//torta_damasco.jpeg', bg: 'from-amber-100 to-orange-200' },

      { id: 'bolo-natal', cat: 'bolos', nome: 'Bolo Natal Dourado', desc: 'Massa branca aromatizada de laranja, brigadeiro de laranja, ganache de chocolate, brigadeiro meio amargo e cobertura chantininho com decoração Papai Noel.', preco: 250, emoji: '🎄', img: './imagens//bolo_natal.jpeg', pos: '50% 20%', bg: 'from-amber-200 to-yellow-400' },
      { id: 'panetone', cat: 'bolos', nome: 'Panetone', desc: 'Tradicional, fofinho e perfumado.', preco: 65, emoji: '🎁', img: './imagens//panetone.jpeg', bg: 'from-amber-100 to-orange-200' },
      { id: 'chocotone', cat: 'bolos', nome: 'Chocotone', desc: 'Clássico natalino com gotas de chocolate.', preco: 65, emoji: '🍫', img: './imagens//chocotone.jpeg', bg: 'from-stone-300 to-amber-900' },

      { id: 'bisc-gingerbread', cat: 'biscoitos', nome: 'Gingerbread com Especiarias', desc: 'Biscoito artesanal com especiarias natalinas. Embalagem de 125g.', preco: 35, emoji: '🍪', img: './imagens//ginger.jpeg', pos: '40% 70%', bg: 'from-amber-200 to-amber-400' },
      { id: 'bisc-laranja', cat: 'biscoitos', nome: 'Laranja com Chocolate', desc: 'Combinação aromática e delicada. Embalagem de 125g.', preco: 35, emoji: '🍊', img: './imagens//biscoito_laranja.jpeg', pos: '50% 50%', bg: 'from-orange-100 to-amber-300' },
      { id: 'bisc-cookies', cat: 'biscoitos', nome: 'Cookies de Chocolate', desc: 'Cookies artesanais de chocolate. Embalagem de 125g.', preco: 35, emoji: '🍪', img: './imagens//cookie.jpeg', pos: '50% 60%', bg: 'from-stone-300 to-stone-600' }
    ];

    const carrinho = {};
    const brl = v => v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

    function renderTabs() {
      const tabs = document.getElementById('tabs');
      tabs.innerHTML = '';
      const todas = [{ id: 'todos', label: 'Todos' }, ...categorias];
      todas.forEach(c => {
        const b = document.createElement('button');
        b.textContent = c.label;
        b.dataset.cat = c.id;
        b.className = 'whitespace-nowrap px-4 py-2 rounded-full border border-pink-600 text-pink-700 text-sm font-medium transition hover:bg-pink-50';
        b.onclick = () => filtrar(c.id);
        tabs.appendChild(b);
      });
    }

    function filtrar(catId) {
      document.querySelectorAll('#tabs button').forEach(b => {
        const ativo = b.dataset.cat === catId;
        b.classList.toggle('tab-active', ativo);
        b.classList.toggle('text-pink-700', !ativo);
      });
      document.querySelectorAll('[data-section]').forEach(sec => {
        sec.style.display = (catId === 'todos' || sec.dataset.section === catId) ? '' : 'none';
      });
    }

    function renderMenu() {
      const main = document.getElementById('menu');
      main.innerHTML = '';
      categorias.forEach(cat => {
        const sec = document.createElement('section');
        sec.dataset.section = cat.id;
        sec.innerHTML = `<h2 class="text-2xl font-bold text-pink-700 border-b-2 border-pink-300 pb-2 mb-6" style="font-family: Georgia, serif;">${cat.label}</h2>
          <div class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3"></div>`;
        const grid = sec.querySelector('div');
        itens.filter(i => i.cat === cat.id).forEach(item => grid.appendChild(criarCard(item)));
        main.appendChild(sec);
      });
    }

    function criarCard(item) {
      const card = document.createElement('article');
      card.className = 'bg-white rounded-2xl shadow-md overflow-hidden flex flex-col hover:shadow-xl transition';
      card.id = 'card-' + item.id;
      card.innerHTML = `
        <div class="h-48 overflow-hidden bg-gradient-to-br ${item.bg} flex items-center justify-center text-7xl" aria-label="Foto de ${item.nome}">${item.img ? `<img src="${item.img}" alt="${item.nome}" class="w-full h-full object-cover" style="object-position: ${item.pos || 'center'}; transform: scale(${item.zoom || 1})">` : `<div class="w-full h-full flex flex-col items-center justify-center gap-2"><span>${item.emoji}</span><span class="text-xs font-medium text-stone-600"></span></div>`}</div>
        <div class="p-5 flex flex-col flex-1">
          <h3 class="font-bold text-lg text-stone-800">${item.nome}</h3>
          <p class="text-sm text-stone-600 mt-1 flex-1">${item.desc}</p>
          <div class="flex items-center justify-between mt-4">
            <span class="text-xl font-bold text-pink-700">${brl(item.preco)}</span>
            <div class="controles"></div>
          </div>
        </div>`;
      atualizarControles(item, card.querySelector('.controles'));
      return card;
    }

    function atualizarControles(item, el) {
      const qtd = carrinho[item.id] || 0;
      if (!el) el = document.querySelector(`#card-${item.id} .controles`);
      if (!el) return;
      if (qtd === 0) {
        el.innerHTML = `<button class="bg-pink-400 hover:bg-pink-300 text-white text-sm font-semibold px-4 py-2 rounded-full">Adicionar</button>`;
        el.querySelector('button').onclick = () => alterar(item.id, 1);
      } else {
        el.innerHTML = `<div class="flex items-center gap-2">
            <button class="w-8 h-8 rounded-full bg-pink-100 hover:bg-pink-200 font-bold text-pink-700">−</button>
            <span class="w-6 text-center font-semibold">${qtd}</span>
            <button class="w-8 h-8 rounded-full bg-pink-400 hover:bg-pink-300 text-white font-bold">+</button>
          </div>`;
        const [menos, mais] = el.querySelectorAll('button');
        menos.onclick = () => alterar(item.id, -1);
        mais.onclick = () => alterar(item.id, 1);
      }
    }

    function alterar(id, delta) {
      carrinho[id] = Math.max(0, (carrinho[id] || 0) + delta);
      if (carrinho[id] === 0) delete carrinho[id];
      const item = itens.find(i => i.id === id);
      atualizarControles(item);
      atualizarResumo();
    }

    function atualizarResumo() {
      let total = 0, quantidade = 0;
      for (const id in carrinho) {
        const item = itens.find(i => i.id === id);
        total += item.preco * carrinho[id];
        quantidade += carrinho[id];
      }
      document.getElementById('total').textContent = brl(total);
      document.getElementById('totalModal').textContent = brl(total);
      document.getElementById('count').textContent = quantidade;
      document.getElementById('verPedido').disabled = quantidade === 0;
      renderLista();
    }

    function renderLista() {
      const lista = document.getElementById('lista');
      const ids = Object.keys(carrinho);
      if (ids.length === 0) {
        lista.innerHTML = '<p class="text-stone-500 text-center py-6">Seu pedido está vazio. Escolha algo delicioso! 🎄</p>';
        return;
      }
      lista.innerHTML = ids.map(id => {
        const item = itens.find(i => i.id === id);
        const q = carrinho[id];
        return `<div class="flex justify-between items-center gap-3 border-b border-pink-100 pb-2">
          <div><p class="font-semibold">${item.nome}</p><p class="text-sm text-stone-500">${q} × ${brl(item.preco)}</p></div>
          <span class="font-bold text-pink-700">${brl(item.preco * q)}</span>
        </div>`;
      }).join('');
    }

    document.getElementById('verPedido').onclick = () => {
      renderLista();
      document.getElementById('modal').classList.remove('hidden');
    };
    document.getElementById('fechar').onclick = () => {
      document.getElementById('modal').classList.add('hidden');
    };
    document.getElementById('modal').onclick = e => {
      if (e.target.id === 'modal') e.target.classList.add('hidden');
    };

    document.getElementById('enviarWhats').onclick = () => {
      const nome = document.getElementById('cliNome').value.trim();
      const tel = document.getElementById('cliTel').value.replace(/\D/g, '');
      const erro = document.getElementById('erroCli');
      if (!nome) {
        erro.textContent = 'Informe seu nome.';
        erro.classList.remove('hidden');
        return;
      }
      if (tel.length < 10 || tel.length > 11) {
        erro.textContent = 'Informe o telefone com DDD.';
        erro.classList.remove('hidden');
        return;
      }
      erro.classList.add('hidden');

      const linhas = ['*Novo pedido - Ana Aguilera*', `Nome: ${nome}`, `Telefone: ${tel}`, ''];
      let total = 0;
      for (const id in carrinho) {
        const item = itens.find(i => i.id === id);
        const q = carrinho[id];
        total += item.preco * q;
        linhas.push(`${q}x ${item.nome} - ${brl(item.preco * q)}`);
      }
      linhas.push('', `Total: ${brl(total)}`);

      const url = 'https://wa.me/5511966230856?text=' + encodeURIComponent(linhas.join('\n'));
      window.open(url, '_blank');
    };

    renderTabs();
    renderMenu();
    filtrar('todos');
    atualizarResumo();
  </script>
</body>
</html>
